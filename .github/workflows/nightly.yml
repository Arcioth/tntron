name: Nightly Build & Release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libvulkan-dev \
            libfontconfig1-dev libfreetype-dev libmpv-dev mpv imagemagick \
            libjxl-tools curl

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java 25 for Fabric 26.2 mod
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Cargo crates & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('minecraft-mod/**/*.gradle*', 'minecraft-mod/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Fetch existing nightly GIFs pack if available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets/gifs
          if gh release download nightly -p "tntron-gifs-pack.tar.gz" -D /tmp/gifs-dl 2>/dev/null; then
            tar -xzf /tmp/gifs-dl/tntron-gifs-pack.tar.gz -C assets/
          fi

      - name: Build nightly bundle with GIFs
        run: |
          chmod +x scripts/build-nightly.sh
          TNTRON_GIFS_DIR="$PWD/assets/gifs" NIGHTLY_TAG="nightly" bash scripts/build-nightly.sh

      - name: Build Fabric 26.2 Minecraft mod JAR
        run: |
          chmod +x minecraft-mod/gradlew
          ./minecraft-mod/gradlew -p minecraft-mod build --no-daemon
          mkdir -p dist
          MOD_JAR=$(find minecraft-mod/build/libs -maxdepth 1 -name 'tntron-fabric-*.jar' ! -name '*-sources.jar' | head -n1)
          if [ -z "$MOD_JAR" ]; then
            echo "ERROR: Built Fabric mod jar not found in minecraft-mod/build/libs" >&2
            exit 1
          fi
          cp "$MOD_JAR" dist/
          (cd dist && sha256sum "$(basename "$MOD_JAR")" > "$(basename "$MOD_JAR").sha256")
          ls -lh dist/tntron-fabric-*.jar

      - name: Setup Java 21 for Android companion APK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android companion APK
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
          chmod +x android-app/gradlew
          ./android-app/gradlew -p android-app assembleRelease --no-daemon
          mkdir -p dist
          APK_SRC=$(find android-app/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1)
          if [ -z "$APK_SRC" ]; then
            echo "ERROR: Built Android APK not found" >&2
            exit 1
          fi
          APK_DST="dist/tntron-android-remote-1.0.0.apk"
          cp "$APK_SRC" "$APK_DST"
          (cd dist && sha256sum "$(basename "$APK_DST")" > "$(basename "$APK_DST").sha256")
          ls -lh "$APK_DST"

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build (with GIFs, Extensions, Fabric 26.2 Mod & Android APK)
          prerelease: true
          files: |
            dist/tntron-nightly-linux-*.tar.gz
            dist/tntron-nightly-linux-*.sha256
            dist/tntron-gifs-pack.tar.gz
            dist/tntron-fabric-*.jar
            dist/tntron-fabric-*.sha256
            dist/tntron-android-*.apk
            dist/tntron-android-*.sha256
